name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Verificar (formatação, compilação, testes unitários e de API)
        run: ./mvnw -B -q verify
      - name: Publicar relatório de cobertura
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cobertura-jacoco
          path: target/site/jacoco
          if-no-files-found: warn
          retention-days: 14

  e2e:
    name: Jornadas no navegador (${{ matrix.navegador }})
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        navegador: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Restaurar o cache dos navegadores do Playwright
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.65.1-${{ matrix.navegador }}-chromium
      # O Chromium completo entra em todos os jobs: o InstalabilidadeIT sempre o usa.
      - name: Instalar o navegador do Playwright, o Chromium e as dependências do sistema
        run: >-
          ./mvnw -B -q exec:java -e
          -Dexec.mainClass=com.microsoft.playwright.CLI
          -Dexec.classpathScope=test
          -Dexec.args="install --with-deps ${{ matrix.navegador }} chromium"
      - name: Rodar as jornadas E2E (testes unitários já rodaram no verify)
        run: >-
          ./mvnw -B -Pe2e -DskipUnitTests=true -Dspotless.check.skip=true verify
          -Dnavegador=${{ matrix.navegador }}
      - name: Publicar capturas e relatórios das jornadas
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-capturas-${{ matrix.navegador }}
          path: |
            target/e2e-capturas
            target/failsafe-reports
          if-no-files-found: warn
          retention-days: 14
