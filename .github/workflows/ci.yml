name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Verificar (formatação, compilação, testes unitários e de API)
        run: ./mvnw -B -q verify

  e2e:
    name: Jornadas no navegador (${{ matrix.navegador }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        navegador: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Instalar o navegador do Playwright e as dependências do sistema
        run: >-
          ./mvnw -B -q exec:java -e
          -Dexec.mainClass=com.microsoft.playwright.CLI
          -Dexec.classpathScope=test
          -Dexec.args="install --with-deps ${{ matrix.navegador }}"
      - name: Verificar com as jornadas E2E
        run: ./mvnw -B -q -Pe2e verify -Dnavegador=${{ matrix.navegador }}
      - name: Publicar capturas das jornadas
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-capturas-${{ matrix.navegador }}
          path: target/e2e-capturas
          if-no-files-found: warn
          retention-days: 14
