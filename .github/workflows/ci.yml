name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# As chaves de cache do front saem de scripts/ci/versoes-do-front.sh (versões lidas do pom.xml).
env:
  PNPM_STORE: ~/.local/share/pnpm/store

jobs:
  verify:
    name: Build e testes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Calcular as chaves de cache do front (versões do pom.xml e lockfile)
        id: front
        run: scripts/ci/versoes-do-front.sh
      - name: Restaurar o Node e o pnpm do front
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: frontend/node
          key: ${{ steps.front.outputs.chave-node }}
      - name: Restaurar o store do pnpm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: ${{ steps.front.outputs.chave-store }}
      # Os testes com banco sobem o Postgres 18 pelo Testcontainers (sem services:); a imagem
      # baixada antes deixa o tempo do download fora dos testes.
      - name: Baixar a imagem do Postgres 18
        run: docker pull postgres:18
      # Todo contexto Spring exige libvips >= 8.15 (ProcessadorDeImagemVips); o 24.04 traz o 8.15.1.
      - name: Instalar o libvips (processamento de fotos)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvips-tools
          vips --version
      - name: Verificar (formatação, compilação, front, testes unitários e de API)
        run: ./mvnw -B -q verify
      # O Node é o que o verify acabou de baixar (ou restaurar do cache) em frontend/node.
      - name: Testar os scripts do Android (node --test)
        run: frontend/node/node --test 'scripts/android/*.test.mjs'
      - name: Publicar relatório de cobertura
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cobertura-jacoco
          path: target/site/jacoco
          if-no-files-found: warn
          retention-days: 14

  e2e:
    name: Jornadas no navegador (${{ matrix.navegador }})
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        navegador: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Calcular as chaves de cache do front (versões do pom.xml e lockfile)
        id: front
        run: scripts/ci/versoes-do-front.sh
      - name: Restaurar o Node e o pnpm do front
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: frontend/node
          key: ${{ steps.front.outputs.chave-node }}
      - name: Restaurar o store do pnpm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: ${{ steps.front.outputs.chave-store }}
      - name: Restaurar o cache dos navegadores do Playwright
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          # A imagem do runner entra na chave: um WebKit baixado em outra imagem pede outra ICU.
          key: playwright-1.65.1-${{ matrix.navegador }}-chromium-${{ env.ImageOS }}-${{ env.ImageVersion }}
      # Os testes com banco sobem o Postgres 18 pelo Testcontainers (sem services:); a imagem
      # baixada antes deixa o tempo do download fora dos testes.
      - name: Baixar a imagem do Postgres 18
        run: docker pull postgres:18
      # Todo contexto Spring exige libvips >= 8.15 (ProcessadorDeImagemVips); o 24.04 traz o 8.15.1.
      - name: Instalar o libvips (processamento de fotos)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvips-tools
          vips --version
      # O Chromium completo entra em todos os jobs: o InstalabilidadeIT sempre o usa.
      - name: Instalar o navegador do Playwright, o Chromium e as dependências do sistema
        run: >-
          ./mvnw -B -q exec:java -e
          -Dexec.mainClass=com.microsoft.playwright.CLI
          -Dexec.classpathScope=test
          -Dexec.args="install --with-deps ${{ matrix.navegador }} chromium"
      - name: Rodar as jornadas E2E (testes unitários já rodaram no verify)
        run: >-
          ./mvnw -B -Pe2e -DskipUnitTests=true -Dspotless.check.skip=true verify
          -Dnavegador=${{ matrix.navegador }}
      - name: Publicar capturas e relatórios das jornadas
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-capturas-${{ matrix.navegador }}
          path: |
            target/e2e-capturas
            target/failsafe-reports
          if-no-files-found: warn
          retention-days: 14

  imagem:
    name: Imagem Docker de produção
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Sem banco nem app no ar: confere libvips >= 8.15, usuário não root e HEALTHCHECK declarado.
      - name: Construir a imagem
        run: docker build -t duora-java:ci .
      - name: Conferir a imagem
        run: scripts/ci/checar-imagem.sh duora-java:ci
