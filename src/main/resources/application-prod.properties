# Produção: segredos só por variável de ambiente, sem valor padrão (o boot falha se faltar).
# Blocos por trilha: cada trilha edita só o seu.

# plataforma
spring.docker.compose.enabled=false
spring.datasource.url=${DUORA_DB_URL}
spring.datasource.username=${DUORA_DB_USUARIO}
spring.datasource.password=${DUORA_DB_SENHA}
# Log em JSON (ECS) só em produção; em dev fica o texto padrão. O correlationId do MDC vira campo.
logging.structured.format.console=ecs
duora.email.provedor=resend
duora.email.resend.chave=${RESEND_API_KEY}

# conta
duora.segredo-email=${DUORA_SEGREDO_EMAIL}
duora.turnstile.chave-do-site=${TURNSTILE_SITE_KEY}
duora.turnstile.segredo=${TURNSTILE_SECRET}
duora.url-publica=${DUORA_URL_PUBLICA}

# legal
duora.encarregado.email=${DUORA_EMAIL_ENCARREGADO}

# verificacao
duora.verificacao.provedor=aws
duora.verificacao.documento.provedor=didit
duora.verificacao.aws.access-key-id=${DUORA_AWS_VERIFICACAO_ACCESS_KEY_ID}
duora.verificacao.aws.secret-access-key=${DUORA_AWS_VERIFICACAO_SECRET_ACCESS_KEY}
duora.verificacao.aws.papel-captura-arn=${DUORA_AWS_PAPEL_CAPTURA_ARN}
duora.verificacao.didit.api-key=${DUORA_DIDIT_API_KEY}

# imagens
duora.imagens.dir=${DUORA_IMAGENS_DIR}

# front
