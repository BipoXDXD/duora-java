spring.application.name=duora
server.address=127.0.0.1
server.port=8080
spring.jackson.deserialization.fail-on-unknown-properties=true

# Blocos por trilha da Etapa 2: cada trilha edita só o seu. Este arquivo passa por resource
# filtering com arroba como delimitador: nunca duas arrobas na mesma linha.

# plataforma
# Sem URL de banco: em dev o compose.yaml fornece a conexão; em prod, application-prod.properties.
spring.flyway.out-of-order=false
management.endpoints.web.exposure.include=health
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-init-sql=SET idle_in_transaction_session_timeout = '30s'

# conta
# Chave HMAC fixa de desenvolvimento para o resumo do e-mail bloqueado; em prod vem do ambiente.
duora.segredo-email=dev-chave-hmac-do-email-bloqueado-nao-usar-em-producao
# Chaves de teste públicas da Cloudflare (sempre aceitam); não são segredo.
duora.turnstile.chave-do-site=1x00000000000000000000AA
duora.turnstile.segredo=1x0000000000000000000000000000000AA

# legal

