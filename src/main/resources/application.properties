spring.application.name=duora
server.address=127.0.0.1
server.port=8080
spring.jackson.deserialization.fail-on-unknown-properties=true

# Blocos por trilha da Etapa 2: cada trilha edita só o seu. Este arquivo passa por resource
# filtering com arroba como delimitador: nunca duas arrobas na mesma linha.

# plataforma
# Sem URL de banco: em dev o compose.yaml fornece a conexão; em prod, application-prod.properties.
spring.flyway.out-of-order=false
management.endpoints.web.exposure.include=health
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-init-sql=SET idle_in_transaction_session_timeout = '30s'
# Vale para todo perfil e toda URL (dev pelo compose, teste jdbc:tc:, prod do ambiente): o PgJDBC
# para de copiar o Detail do servidor (Key (email)=(...)) na mensagem da exce\u00e7\u00e3o, que
# pode ir para o log.
spring.datasource.hikari.data-source-properties.logServerErrorDetail=false
# Depois disso, uma reserva sem resposta é tida como abandonada e pode ser retomada.
duora.idempotencia.reserva-maxima=PT30S
# Tarefas agendadas (despachante da outbox e retenção); a config de teste as desliga.
duora.agendamentos.habilitados=true
# Pausa entre o fim de um despacho da outbox e o começo do próximo.
duora.outbox.intervalo=PT2S
# O agendador é dividido entre o despachante, o varredor do terraço e a retenção, uma thread para
# cada (a retenção longa não atrasa a outbox); no desligamento, espera o lote em andamento terminar.
spring.task.scheduling.pool.size=3
spring.task.scheduling.shutdown.await-termination=true
spring.task.scheduling.shutdown.await-termination-period=PT30S
# E-mail: em dev e test, o EmailNoLog escreve o link no log; em prod, o Resend.
duora.email.provedor=log
duora.email.remetente=Duora <entrar@meetduora.com>
# Expiração diária das políticas de retenção, às 03:30 de São Paulo (ADR 0006).
duora.retencao.cron=0 30 3 * * *

# conta
# Chave HMAC fixa de desenvolvimento para o resumo do e-mail bloqueado; em prod vem do ambiente.
duora.segredo-email=dev-chave-hmac-do-email-bloqueado-nao-usar-em-producao
# Chaves de teste públicas da Cloudflare (sempre aceitam); não são segredo.
duora.turnstile.chave-do-site=1x00000000000000000000AA
duora.turnstile.segredo=1x0000000000000000000000000000000AA
# Base dos links enviados por e-mail; em prod vem de DUORA_URL_PUBLICA.
duora.url-publica=http://127.0.0.1:8080
# Pedido de link m\u00e1gico: por IP e por caixa de entrada (Email.chaveDeBloqueio).
duora.limites.regras.entrar-ip.capacidade=20
duora.limites.regras.entrar-ip.periodo=PT10M
duora.limites.regras.entrar-email.capacidade=3
duora.limites.regras.entrar-email.periodo=PT15M
# Confirma\u00e7\u00e3o do link m\u00e1gico: por IP.
duora.limites.regras.confirmar-ip.capacidade=30
duora.limites.regras.confirmar-ip.periodo=PT10M
# Cadastro: por conta.
duora.limites.regras.cadastro-conta.capacidade=10
duora.limites.regras.cadastro-conta.periodo=PT10M
# Den\u00fancia p\u00fablica sem conta: por IP.
duora.limites.regras.denuncia-publica-ip.capacidade=5
duora.limites.regras.denuncia-publica-ip.periodo=PT1H
# Limites di\u00e1rios nos primeiros 7 dias depois da ativa\u00e7\u00e3o (dia de S\u00e3o Paulo).
duora.conta-nova.mensagens-por-dia=200
duora.conta-nova.imagens-por-dia=10
duora.conta-nova.convites-por-dia=3

# verificacao
# Prova de vida e confer\u00eancia de documento (duora.verificacao.provedor e
# duora.verificacao.documento.provedor): sem padr\u00e3o aqui. Prod liga aws nos dois; o perfil
# verificacao-falsa e a config de teste ligam os falsos. Sem escolha, o boot cai
# (ProvedoresDaVerificacao); em prod, a GuardaDaVerificacaoReal derruba o boot com falso.
# Tentativas por conta em 24 h corridas; os mesmos padrões do LimitesDaVerificacao.
duora.verificacao.tentativas-por-dia=3
duora.verificacao.envios-de-documento-por-dia=2
# Contra rajada nos três POST da verificação, por conta; o limite do dia fica no banco.
duora.limites.regras.verificacao-conta.capacidade=20
duora.limites.regras.verificacao-conta.periodo=PT10M
# Frente e verso do documento (até 5 MB cada, com folga) ficam só em memória: o limiar de disco
# não é menor que a requisição inteira. A leitura preguiçosa deixa a sessão ser conferida antes
# de o corpo ser lido.
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=13MB
spring.servlet.multipart.file-size-threshold=13MB
spring.servlet.multipart.resolve-lazily=true

# legal
duora.contato.email=support@meetduora.com
# Escape unicode: o Spring lê .properties em ISO-8859-1.
duora.encarregado.nome=o respons\u00e1vel pelo Duora
# Marcador de desenvolvimento; em prod vem de DUORA_EMAIL_ENCARREGADO.
duora.encarregado.email=encarregado@exemplo.invalid

# imagens
# Fotos processadas pelo libvips por processo (ProcessadorDeImagemVips): vips >= 8.15 no PATH, ou o
# boot cai. Os padrões de prazo, espera e simultâneos ficam no ConfigDeImagens.
duora.imagens.dir=${DUORA_IMAGENS_DIR:./dados/imagens}
# Moderação automática da foto (duora.imagens.moderacao.provedor): sem padrão aqui, toda foto fica
# pendente para a revisão humana (SemModeracaoDeImagem); prod liga aws.
# Envio da foto de perfil: por conta.
duora.limites.regras.foto-conta.capacidade=10
duora.limites.regras.foto-conta.periodo=PT1H

# sala
# Cenários que os encontros podem sortear, na ordem de exibição (CenariosConfig).
duora.cenarios.sorteaveis=terraco
# Fila contínua e pareamento (ConfigDoPareamento): o ciclo roda a cada 5 s e lê até 200 entradas; o
# par tem 60 s para chegar; 60 s sem a tela aberta tira da fila; até 10 encontros ocupam vaga.
duora.pareamento.ciclo=PT5S
duora.pareamento.prazo-para-entrar=PT60S
duora.pareamento.lote=200
duora.fila.ausencia-maxima=PT60S
duora.encontros.maximo-simultaneos=10
# Entrar na fila: por conta.
duora.limites.regras.fila-entrar.capacidade=10
duora.limites.regras.fila-entrar.periodo=PT1M

# front

# eventos
# Stream SSE de /api/eventos (ADR 0002): reconecta depois da duração máxima. O
# batimento fica bem abaixo dos 60 s do readTimeout do Traefik v3 e revela o cliente que sumiu.
duora.eventos.duracao-maxima=PT30M
duora.eventos.batimento=PT25S

# push
# Web Push (ADR 0009). Desligado, o aviso s\u00f3 vai para o log. As chaves VAPID v\u00eam do ambiente
# (README, "Deploy (Coolify)"); ligado sem elas, o boot cai. O endpoint de cada inscri\u00e7\u00e3o
# precisa ser um destes hosts ou subdom\u00ednio deles (allowlist contra SSRF).
# Nasce desligado em todo perfil, inclusive prod: o boot n\u00e3o depende das chaves VAPID.
duora.push.habilitado=${DUORA_PUSH_HABILITADO:false}
duora.push.chave-publica=${DUORA_VAPID_PUBLICA:}
duora.push.chave-privada=${DUORA_VAPID_PRIVADA:}
duora.push.assunto=mailto:${duora.contato.email}
duora.push.hosts-permitidos=fcm.googleapis.com,updates.push.services.mozilla.com,push.apple.com,notify.windows.com
