spring.application.name=duora
server.address=127.0.0.1
server.port=8080
spring.jackson.deserialization.fail-on-unknown-properties=true

# Blocos por trilha da Etapa 2: cada trilha edita só o seu. Este arquivo passa por resource
# filtering com arroba como delimitador: nunca duas arrobas na mesma linha.

# plataforma
# Sem URL de banco: em dev o compose.yaml fornece a conexão; em prod, application-prod.properties.
spring.flyway.out-of-order=false
management.endpoints.web.exposure.include=health
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-init-sql=SET idle_in_transaction_session_timeout = '30s'
# Vale para todo perfil e toda URL (dev pelo compose, teste jdbc:tc:, prod do ambiente): o PgJDBC
# para de copiar o Detail do servidor (Key (email)=(...)) na mensagem da exce\u00e7\u00e3o, que
# pode ir para o log.
spring.datasource.hikari.data-source-properties.logServerErrorDetail=false
# Depois disso, uma reserva sem resposta é tida como abandonada e pode ser retomada.
duora.idempotencia.reserva-maxima=PT30S
# Tarefas agendadas (despachante da outbox e retenção); a config de teste as desliga.
duora.agendamentos.habilitados=true
# Pausa entre o fim de um despacho da outbox e o começo do próximo.
duora.outbox.intervalo=PT2S
# O agendador é dividido entre o despachante, o varredor do terraço e a retenção, uma thread para
# cada (a retenção longa não atrasa a outbox); no desligamento, espera o lote em andamento terminar.
spring.task.scheduling.pool.size=3
spring.task.scheduling.shutdown.await-termination=true
spring.task.scheduling.shutdown.await-termination-period=PT30S
# E-mail: em dev e test, o EmailNoLog escreve o link no log; em prod, o Resend.
duora.email.provedor=log
duora.email.remetente=Duora <entrar@meetduora.com>
# Expiração diária das políticas de retenção, às 03:30 de São Paulo (ADR 0006).
duora.retencao.cron=0 30 3 * * *

# conta
# Chave HMAC fixa de desenvolvimento para o resumo do e-mail bloqueado; em prod vem do ambiente.
duora.segredo-email=dev-chave-hmac-do-email-bloqueado-nao-usar-em-producao
# Chaves de teste públicas da Cloudflare (sempre aceitam); não são segredo.
duora.turnstile.chave-do-site=1x00000000000000000000AA
duora.turnstile.segredo=1x0000000000000000000000000000000AA
# Base dos links enviados por e-mail; em prod vem de DUORA_URL_PUBLICA.
duora.url-publica=http://127.0.0.1:8080
# Pedido de link m\u00e1gico: por IP e por caixa de entrada (Email.chaveDeBloqueio).
duora.limites.regras.entrar-ip.capacidade=20
duora.limites.regras.entrar-ip.periodo=PT10M
duora.limites.regras.entrar-email.capacidade=3
duora.limites.regras.entrar-email.periodo=PT15M
# Confirma\u00e7\u00e3o do link m\u00e1gico: por IP.
duora.limites.regras.confirmar-ip.capacidade=30
duora.limites.regras.confirmar-ip.periodo=PT10M
# Cadastro: por conta.
duora.limites.regras.cadastro-conta.capacidade=10
duora.limites.regras.cadastro-conta.periodo=PT10M

# legal
duora.contato.email=support@meetduora.com
# Escape unicode: o Spring lê .properties em ISO-8859-1.
duora.encarregado.nome=o respons\u00e1vel pelo Duora
# Marcador de desenvolvimento; em prod vem de DUORA_EMAIL_ENCARREGADO.
duora.encarregado.email=encarregado@exemplo.invalid

# front
