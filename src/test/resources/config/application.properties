# Config de teste: o Spring carrega classpath:/config/ além da principal, no Maven e na IDE.

# plataforma
# Um único Postgres 18 por JVM de teste: a URL jdbc:tc: sobe o contêiner, e o TC_DAEMON o mantém
# vivo entre os contextos até a JVM sair (o Ryuk o remove).
spring.datasource.url=jdbc:tc:postgresql:18:///duora?TC_DAEMON=true
# Pool pequeno por contexto: o cache de contextos guarda vários ao mesmo tempo.
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=0
# Em milissegundos: o HikariConfig liga em long, e "10s" não converte.
spring.datasource.hikari.idle-timeout=10000
duora.agendamentos.habilitados=false

